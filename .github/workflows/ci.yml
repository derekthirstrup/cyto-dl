name: CI

on:
  pull_request:
    branches: [main, "release/*"]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache pre-commit hook envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --verbose

  test:
    runs-on: ${{ matrix.os }}
    needs: lint
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements/test-requirements.txt"
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          uv venv --python 3.13
          uv pip install --no-deps -r requirements/test-requirements.txt
          uv pip install --no-deps .

      - name: Cache S3 test data
        uses: actions/cache@v4
        with:
          path: data/example_experiment_data/s3_data
          key: cyto-dl-test-data-v1-${{ hashFiles('cyto_dl/utils/download_test_data.py') }}

      - name: Run pytest
        shell: bash
        env:
          CYTO_DL_KEEP_TEST_DATA: "1"
          CYTO_DL_SKIP_3D: "1"
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            uv run pytest -v -m "not slow" -o addopts= -n auto --durations=25 --cov cyto_dl --cov-report=xml
          else
            uv run pytest -v -m "not slow" -o addopts= -n auto --durations=25
          fi

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements/docs-requirements.txt"
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv venv --python 3.13
          uv pip install --no-deps -r requirements/docs-requirements.txt
          uv pip install --no-deps .

      - name: Generate docs
        run: |
          source .venv/bin/activate
          make gen-docs
          touch docs/_build/html/.nojekyll

      - name: Publish docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/_build/html
