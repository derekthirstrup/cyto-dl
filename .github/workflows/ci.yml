name: CI

on:
  pull_request:
    branches: [main, "release/*"]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Run pre-commit
        run: uv tool run pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements/test-requirements.txt"
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          uv venv --python 3.13
          uv pip install --no-deps -r requirements/test-requirements.txt
          uv pip install --no-deps .

      - name: Run pytest
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            uv run pytest -v --cov cyto_dl --cov-report=xml
          else
            uv run pytest -v
          fi

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements/docs-requirements.txt"
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv venv --python 3.13
          uv pip install --no-deps -r requirements/docs-requirements.txt
          uv pip install --no-deps .

      - name: Generate docs
        run: |
          source .venv/bin/activate
          make gen-docs
          touch docs/_build/html/.nojekyll

      - name: Publish docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          branch: gh-pages
          folder: docs/_build/html
