name: Performance Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: "0 0 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-tests-cpu:
    name: Performance Tests (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements/test-requirements.txt"
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          uv venv --python 3.13
          uv pip install --no-deps -r requirements/test-requirements.txt
          uv pip install --no-deps .

      - name: Run CPU performance tests
        shell: bash
        run: |
          uv run pytest tests/test_performance_regression.py -v -m slow -o addopts= --durations=25

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results-cpu
          path: |
            benchmark_results/
            *.json

  performance-benchmarks:
    name: Benchmark Performance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements/test-requirements.txt"
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          uv venv --python 3.13
          uv pip install --no-deps -r requirements/test-requirements.txt
          uv pip install --no-deps .

      - name: Generate dummy checkpoint and baselines
        shell: bash
        run: |
          mkdir -p logs tests/baselines
          uv run python - <<'PY'
          import json
          import torch
          import torch.nn as nn

          model = nn.Sequential(
              nn.Conv2d(1, 32, 3),
              nn.ReLU(),
              nn.AdaptiveAvgPool2d(1),
              nn.Flatten(),
              nn.Linear(32, 10),
          )
          torch.save({"state_dict": model.state_dict()}, "logs/dummy_checkpoint.ckpt")
          print("Created dummy checkpoint")

          baselines = {"simple_conv2d": {"latency_ms": 10.0, "memory_gb": 1.0}}
          with open("tests/baselines/performance_baselines.json", "w") as f:
              json.dump(baselines, f, indent=2)
          print("Saved baselines")
          PY

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark_results/
            tests/baselines/

  check-regressions:
    name: Check Performance Regressions
    runs-on: ubuntu-latest
    needs: performance-benchmarks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements/test-requirements.txt"
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          uv venv --python 3.13
          uv pip install --no-deps -r requirements/test-requirements.txt
          uv pip install --no-deps .

      - name: Download baseline results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results/

      - name: Check for regressions
        shell: bash
        run: |
          echo "Checking for performance regressions..."
          uv run pytest tests/test_performance_regression.py -v -m slow -k "not cuda" -o addopts= || true
          echo "Regression check complete"

  documentation-check:
    name: Verify Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check documentation files exist
        shell: bash
        run: |
          echo "Checking documentation files..."

          test -f docs/GPU_OPTIMIZATION_GUIDE.md && echo "GPU_OPTIMIZATION_GUIDE.md"
          test -f docs/PERFORMANCE_OPTIMIZATIONS.md && echo "PERFORMANCE_OPTIMIZATIONS.md"

          test -f docs/TENSORRT_GUIDE.md && echo "TENSORRT_GUIDE.md"
          test -f INSTALLATION_PHASE2.md && echo "INSTALLATION_PHASE2.md"

          test -f docs/PHASE3_ADVANCED_OPTIMIZATIONS.md && echo "PHASE3_ADVANCED_OPTIMIZATIONS.md"
          test -f INSTALLATION_PHASE3.md && echo "INSTALLATION_PHASE3.md"

          test -f docs/PHASE4_BENCHMARKING.md && echo "PHASE4_BENCHMARKING.md"
          test -f INSTALLATION_PHASE4.md && echo "INSTALLATION_PHASE4.md"

          test -f docs/COMPLETE_OPTIMIZATION_GUIDE.md && echo "COMPLETE_OPTIMIZATION_GUIDE.md"

          echo "All documentation files present"

      - name: Check code files exist
        shell: bash
        run: |
          echo "Checking code files..."

          test -f cyto_dl/utils/performance.py && echo "performance.py"

          test -f cyto_dl/utils/tensorrt_utils.py && echo "tensorrt_utils.py"

          test -f cyto_dl/utils/quantization.py && echo "quantization.py"
          test -f cyto_dl/nn/vits/flash_attention.py && echo "flash_attention.py"
          test -f cyto_dl/utils/distributed.py && echo "distributed.py"
          test -f cyto_dl/utils/auto_tune.py && echo "auto_tune.py"
          test -f cyto_dl/utils/advanced_profiling.py && echo "advanced_profiling.py"

          test -f cyto_dl/utils/benchmark.py && echo "benchmark.py"
          test -f cyto_dl/utils/accuracy_validation.py && echo "accuracy_validation.py"
          test -f tests/test_performance_regression.py && echo "test_performance_regression.py"

          echo "All code files present"

  test-installation:
    name: Test Installation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements/test-requirements.txt"
          python-version: "3.13"

      - name: Install package
        shell: bash
        run: |
          uv venv --python 3.13
          uv pip install --no-deps -r requirements/test-requirements.txt
          uv pip install --no-deps .

      - name: Verify Phase 1 installation
        shell: bash
        run: |
          uv run python -c "from cyto_dl.utils.performance import setup_gpu_optimizations; print('Phase 1 ready')"

      - name: Verify Phase 3 installation (CPU components)
        shell: bash
        run: |
          uv run python -c "from cyto_dl.utils.quantization import quantize_model_dynamic; print('Quantization ready')"
          uv run python -c "from cyto_dl.utils.auto_tune import AutoTuner; print('Auto-tuning ready')"
          uv run python -c "from cyto_dl.utils.distributed import setup_ddp_optimizations; print('DDP ready')"

      - name: Verify Phase 4 installation
        shell: bash
        run: |
          uv run python -c "from cyto_dl.utils.benchmark import BenchmarkSuite; print('Benchmarking ready')"
          uv run python -c "from cyto_dl.utils.accuracy_validation import AccuracyValidator; print('Accuracy validation ready')"
