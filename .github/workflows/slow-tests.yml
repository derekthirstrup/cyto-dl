name: Slow Tests

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slow-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements/test-requirements.txt"
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          uv venv --python 3.13
          uv pip install --no-deps -r requirements/test-requirements.txt
          uv pip install --no-deps .

      - name: Run full pytest (including slow)
        shell: bash
        run: uv run pytest -v -o addopts= --durations=50
