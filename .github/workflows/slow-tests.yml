name: Slow Tests

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slow-test:
    name: slow-test (${{ matrix.dims }}D)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - dims: 2
            skip_2d: ""
            skip_3d: "1"
          - dims: 3
            skip_2d: "1"
            skip_3d: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements/test-requirements.txt"
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          uv venv --python 3.13
          uv pip install --no-deps -r requirements/test-requirements.txt
          uv pip install --no-deps .

      - name: Cache S3 test data
        uses: actions/cache@v4
        with:
          path: data/example_experiment_data/s3_data
          key: cyto-dl-test-data-v1-${{ hashFiles('cyto_dl/utils/download_test_data.py') }}

      - name: Run slow pytest (${{ matrix.dims }}D only)
        shell: bash
        env:
          CYTO_DL_KEEP_TEST_DATA: "1"
          CYTO_DL_SKIP_2D: ${{ matrix.skip_2d }}
          CYTO_DL_SKIP_3D: ${{ matrix.skip_3d }}
        run: uv run pytest -v -o addopts= -n auto --durations=50
