name: Slow Tests

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slow-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements/test-requirements.txt"
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          uv venv --python 3.13
          uv pip install --no-deps -r requirements/test-requirements.txt
          uv pip install --no-deps .

      - name: Cache S3 test data
        uses: actions/cache@v4
        with:
          path: data/example_experiment_data/s3_data
          key: cyto-dl-test-data-v1-${{ hashFiles('cyto_dl/utils/download_test_data.py') }}

      - name: Run full pytest (including slow, 2D + 3D)
        shell: bash
        env:
          CYTO_DL_KEEP_TEST_DATA: "1"
        run: uv run pytest -v -o addopts= -n auto --durations=50
