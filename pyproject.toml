[build-system]
requires = ["pdm-pep517>=1.0.0", "numpy>=1.23.5"]
build-backend = "pdm.pep517.api"

[project]
name = "cyto-dl"
version = "0.6.1"
description = """\
  Collection of representation learning models, techniques, callbacks, utils, \
  used to create latent variable models of cell shape, morphology and \
  intracellular organization.\
  """
readme = "README.md"
authors = [
    { name = "Benji Morris", email = "benjamin.morris@alleninstitute.org" },
    { name = "Guilherme Pires", email = "guilherme.pires@alleninstitute.org" },
    { name = "Ritvik Vasan", email = "ritvik.vasan@alleninstitute.org" },
]
dependencies = [
    "hydra-core>=1.3.2",
    "hydra-colorlog>=1.2.0",
    "hydra-optuna-sweeper>=1.2.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "numpy>=2.4.4",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "fire>=0.7.1",
    "mlflow>=3.12.0",
    "omegaconf>=2.3.0",
    "pyarrow>=23.0.1",
    "pyrootutils>=1.0.4",
    "PyYAML>=6.0.3",
    "scikit-learn>=1.8.0",
    "universal-pathlib>=0.3.10",
    "zarr>=3.1.6",
    "ome-zarr>=0.16.0",
    "anndata>=0.12.12",
    "monai>=1.5.2",
    "timm>=1.0.26",
    "tqdm>=4.67.3",
    "lightning>=2.6.1",
    "einops>=0.8.2",
    "edt>=3.1.1",
    "astropy>=7.2.0",
    "rich>=15.0.0",
    "boto3>=1.43.0",
    "bioio>=3.3.0",
    "bioio-base>=3.3.0",
    "bioio-czi>=2.7.1",
    "bioio-ome-tiff>=1.4.0",
    "bioio-ome-zarr>=3.4.0",
    "bioio-tifffile>=1.3.0",
    "tifffile>=2026.3.3",
    "online-stats>=2023.6",
    "opencv-python>=4.13.0.92",
    "positional-encodings>=6.0.3",
]
requires-python = ">=3.11,<3.13"

[project.optional-dependencies]
equiv = [
    "lie_learn>=0.0.1.post1",
    "escnn>=1.0.11",
    "py3nj>=0.2.1",
    "e3nn>=0.6.0"
]
spharm = [
    "vtk>=9.6.1",
    "aicscytoparam>=0.2.1",
    "pyshtools>=4.14.1",
]
s3 = [
    "boto3>=1.43.0",
    "s3fs>=2026.4.0"
]
torchserve = [
    "torchserve>=0.12.0",
    "gorilla>=0.4.0",
]
pcloud = [
    "pyntcloud>=0.3.1",
    "aicsshparam>=0.1.11",
    "torch-geometric>=2.7.0",
    "point-cloud-utils>=0.34.0",
    "geomloss>=0.3.1",
    "Ninja>=1.13.0",
    "torchio>=1.2.0",
]
tensorrt = [
    "torch-tensorrt>=2.11.0",
    "nvidia-tensorrt>=99.0.0",
]
gui = [
    "streamlit>=1.57.0",
]
all = [
    "cyto-dl[equiv,spharm,s3,torchserve,pcloud,tensorrt,gui]",
]
test = [
    "cyto-dl",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
docs = [
    "cyto-dl",
    "furo>=2025.12.19",
    "m2r2>=0.3.4",
    "sphinx>=9.0.4",
]


[project.urls]
Homepage = "https://github.com/AllenCellModeling/cyto-dl"

[tool.pdm.build]
includes = ["cyto_dl", "README.md", "LICENSE", "**/*.yaml" ]
excludes = ["**/*.pyc", "**/__pycache__"]

[tool.flake8]
ignore = [
    "E203",
    "E402",
    "W291",
    "W503",
]
max-line-length = 88

[tool.pytest.ini_options]
addopts = [
    "--color=yes",
    "--durations=0",
    "--strict-markers",
    "--doctest-modules",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
log_cli = "True"
markers = [
    "slow: slow tests",
    "performance: performance regression tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]

# https://pypi.org/project/bumpver
[tool.bumpver]
current_version = "0.6.1"
version_pattern = "MAJOR.MINOR.PATCH[.PYTAGNUM]"
commit_message  = "Bump version {old_version} -> {new_version}"
commit          = true
tag             = false # no longer useful to tag here, must happen in create_publish_pr.yaml
push            = false

[tool.bumpver.file_patterns]
"pyproject.toml" = ['current_version = "{version}"', 'version = "{version}"']
"version.toml" = ['version = "{version}"']
"cyto_dl/__init__.py" = ['__version__ = "{version}"']

[tool.uv]
# lie_learn 0.0.1.post1 has a build-time dependency on numpy that is not declared in its
# metadata. Therefore, we must disable PEP 517 build isolation to install it.
# This means that uv users who want to use equivariant models must install dependencies
# in two steps: `uv sync`, then `uv sync --extra equiv`.
no-build-isolation-package = ["lie_learn"]
